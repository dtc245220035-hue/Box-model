<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Nền chính gradient xanh đậm -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7abf;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg-grad)"/>

  <!-- Vòng tròn trang trí lớn -->
  <circle cx="680" cy="80"  r="130" fill="rgba(255,255,255,0.05)"/>
  <circle cx="700" cy="100" r="90"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="100" cy="320" r="160" fill="rgba(255,255,255,0.04)"/>
  <circle cx="80"  cy="340" r="100" fill="rgba(255,255,255,0.04)"/>

  <!-- Đường kẻ trang trí -->
  <line x1="0"   y1="200" x2="800" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0"   y1="100" x2="800" y2="100" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0"   y1="300" x2="800" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="200" y1="0"   x2="200" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0"   x2="400" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0"   x2="600" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Chấm trang trí nhỏ -->
  <circle cx="200" cy="100" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="400" cy="200" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="600" cy="100" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="300" cy="300" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="500" cy="300" r="4" fill="rgba(255,255,255,0.15)"/>
</svg>

