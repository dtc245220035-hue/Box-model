<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Bộ chọn element: h1 -->
        <h1>Trang web của tôi</h1>

        <!-- Bộ chọn element: p -->
        <p id="intro">
            Xin chào! Tôi là <strong>Nguyễn Văn A</strong>, một sinh viên đam mê
            lập trình Web. Tôi đang học HTML, CSS và JavaScript tại CodeGym
            với mục tiêu trở thành một lập trình viên chuyên nghiệp.
        </p>

        <!-- Bộ chọn class: .section-title -->
        <h2 class="section-title">🎯 Sở thích của tôi</h2>

        <!-- Bộ chọn element: ul / li + bộ chọn nth-child -->
        <ul class="hobby-list">
            <li>💻 Lập trình Web</li>
            <li>📚 Đọc sách công nghệ</li>
            <li>⚽ Chơi thể thao</li>
        </ul>

        <!-- Bộ chọn element + pseudo-class :hover cho button -->
        <div class="btn-wrapper">
            <button class="btn-main">Nhấn vào đây</button>
        </div>

    </div>

</body>
</html>
